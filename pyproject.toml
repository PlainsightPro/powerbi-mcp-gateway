[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "powerbi-mcp-gateway"
dynamic = ["version"]
description = "Power BI MCP Gateway: per-user access to semantic models for MCP clients, with central skills and Foundry-backed DAX generation"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0,<5",
    "openai>=1.106",
    "azure-identity>=1.25",
    "httpx>=0.27",
    "pyyaml>=6",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "aiohttp>=3.9",  # azure.identity.aio (OnBehalfOfCredential used by EntraOBOToken) needs it
    "py-key-value-aio[azure-tables]>=0.4",  # durable OAuth proxy state (state_store.py); the base package comes with fastmcp
]

[project.urls]
Source = "https://github.com/PlainsightPro/powerbi-mcp-gateway"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.12",
    "pyright>=1.1.400",
]

[tool.hatch.version]
path = "powerbi_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["powerbi_mcp"]

[tool.hatch.build.targets.sdist]
include = ["powerbi_mcp/", "pyproject.toml", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # the formatter wraps code; the few long strings left are clearer unbroken

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["powerbi_mcp", "tests", "scripts"]
venvPath = "."
venv = ".venv"
