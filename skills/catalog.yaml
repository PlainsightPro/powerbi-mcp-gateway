# Curated semantic-model catalog (example). Only models the signed-in user can actually open are
# ever returned by list_semantic_models; this file adds business context for the ones you know.
# Ids are Power BI semantic model (dataset) ids: app.powerbi.com/groups/{workspace}/datasets/{id}.
models:
  - id: 11111111-1111-1111-1111-111111111111
    name: Finance
    workspace: Finance
    description: >
      Group P&L on the bookkeeping bookings with management corrections. The model for revenue,
      margin, indirect cost and EBITDA questions.
    data_scope: All legal entities; filter 'Transactions'[Legal Entity] for one.
    default_date_table: Date
    key_measures: [Revenue, Direct Cost, Gross Margin, Overhead, Indirect Cost, EBITDA, EBITDA % Revenue]
    recipes: [indirect-cost-analysis, ebitda-bridge]
    notes: |
      The current month is incomplete until month-end bookings are loaded.

  - id: 22222222-2222-2222-2222-222222222222
    name: Sales
    workspace: Sales
    description: CRM deals, pipeline stages, companies and owners.
    data_scope: All business units.
    default_date_table: Date
    key_measures: [Won Amount, Open Pipeline, Deal Count]
    notes: |
      Stage labels repeat across pipelines: scope every funnel to one pipeline.
