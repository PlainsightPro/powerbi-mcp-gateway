# Curated semantic-model catalog (EXAMPLE, fictional company). Only models the signed-in user can
# actually open are ever returned by list_semantic_models; this file adds business context for
# the ones you know. Ids are Power BI semantic model (dataset) ids:
# app.powerbi.com/groups/{workspace}/datasets/{id}
models:
  - id: 11111111-1111-1111-1111-111111111111
    name: Contoso Sales
    workspace: Sales Analytics
    description: >
      Invoice lines by product, store and customer with the retail KPIs (revenue, units, gross
      margin, basket). The model for "how are sales doing" questions.
    data_scope: All countries; filter 'Store'[Country] for one market.
    default_date_table: Date
    key_measures: [Revenue, Units, Gross Margin, Gross Margin %, Average Order Value, Revenue YoY %]
    recipes: [monthly-trend, top-movers, detail-drilldown]
    notes: |
      Returns are negative invoice lines; [Revenue] already nets them.
      The current month is incomplete until the nightly load has run.

  - id: 22222222-2222-2222-2222-222222222222
    name: Contoso Inventory
    workspace: Supply Chain
    description: Stock on hand, days of cover and stock-outs per warehouse and product.
    data_scope: All warehouses.
    default_date_table: Date
    key_measures: [Stock Units, Stock Value, Days of Cover, Stock-out Days]
    recipes: [monthly-trend, top-movers]
