name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository; the token gets read access only.
permissions:
  contents: read

# A newer push to the same pull request supersedes the run in progress. Never cancel on main:
# that run is the record for the merged commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor of requires-python and the interpreter the image ships (Dockerfile).
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q
      - run: uv run python -m powerbi_mcp --check-skills skills

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --build-arg VERSION=ci -t gateway:ci .
      - name: Start the image with dummy settings and probe /healthz
        run: |
          docker run -d --name gateway -p 8000:8000 \
            -e PBIMCP_TENANT_ID=00000000-0000-0000-0000-000000000001 \
            -e PBIMCP_CLIENT_ID=00000000-0000-0000-0000-000000000002 \
            -e PBIMCP_CLIENT_SECRET=not-a-real-secret \
            -e PBIMCP_JWT_SIGNING_KEY=0123456789abcdef0123456789abcdef \
            gateway:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then echo; exit 0; fi
            sleep 1
          done
          docker logs gateway
          exit 1

  secrets:
    # Hard gate: a credential anywhere in the history fails the build. This is a public repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, not just the tip
      - name: gitleaks
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner

  audit:
    # Informational: a vulnerable transitive dependency should not block a merge on its own.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv export --frozen --no-dev --no-emit-project -o requirements-export.txt
      - run: uvx --with pip pip-audit --no-deps -r requirements-export.txt
