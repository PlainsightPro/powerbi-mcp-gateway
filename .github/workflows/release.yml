name: release

# Publishes the engine image on every version tag. Deployments layer their private skills on it:
#   deploy_to_azure.ps1 -Profile <profile.json> -EngineImage ghcr.io/plainsightpro/powerbi-mcp-gateway:<version>
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # the GitHub Release
  packages: write   # the image

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      - id: meta
        name: Check that the tag matches the package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="$(uv run python -c 'import powerbi_mcp; print(powerbi_mcp.__version__)')"
          if [ "$version" != "$package" ]; then
            echo "Tag $GITHUB_REF_NAME does not match powerbi_mcp.__version__ ($package); bump the version first." >&2
            exit 1
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
      - name: GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Engine image: \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}\`"
